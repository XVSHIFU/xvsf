version 15.7
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname r11
!
boot-start-marker
boot-end-marker
!
!
!
no aaa new-model
!
!
!
clock timezone EET 2 0
mmi polling-interval 60
no mmi auto-configure
no mmi pvc
mmi snmp-timeout 180
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!


!
!
!
!
no ip domain lookup
ip cef
ipv6 unicast-routing
ipv6 cef
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
redundancy
!
no cdp run
!
! 
!
!
!
!
!
!
!
!
!
!
!
!
interface Loopback0
 ip address 10.1.255.11 255.255.255.255
 ip ospf 1 area 0
 ipv6 address 2001:DB8:1:255::11/128
 ipv6 enable
!
interface Ethernet0/0
 description https://ccielabcenter.com
 ip address 100.3.11.2 255.255.255.252
 duplex auto
 ipv6 address FE80::11 link-local
 ipv6 address 2001:2710:311::2/64
!
interface Ethernet0/1
 description https://ccielabcenter.com
 ip address 10.1.99.1 255.255.255.252
 ip ospf 1 area 0
 duplex auto
 ipv6 address FE80::11 link-local
!
interface Ethernet0/2
 description https://ccielabcenter.com
 ip address 10.1.13.1 255.255.255.252
 ip ospf 1 area 0
 duplex auto
 ipv6 address FE80::1mestamp
!
route-map NH6 permit 10
 set ipv6 next-hop 2001:2710:311::1
!
route-map TAG deny 10
 match tag 150
!
route-map TAG permit 20
!
!
!
control-plane
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
line vty 0 4
 privilege level 15
 no login
 transport input all
!
!
end
