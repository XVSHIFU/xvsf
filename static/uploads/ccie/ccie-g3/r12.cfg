version 15.7
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname r12
!
boot-start-marker
boot-end-marker
!
!
!
no aaa new-model
!
!
!
clock timezone EET 2 0
mmi polling-interval 60
no mmi auto-configure
no mmi pvc
mmi snmp-timeout 180
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!


!
!
!
!
no ip domain lookup
ip cef
ipv6 unicast-routing
ipv6 cef
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
redundancy
!
no cdp run
!
! 
!
!
!
!
!
!
!
!
!
!
!
!
interface Loopback0
 ip address 10.1.255.12 255.255.255.255
 ip ospf 1 area 0
 ipv6 address 2001:DB8:1:255::12/128
!
interface Ethernet0/0
 description https://ccielabcenter.com
 ip address 200.99.12.2 255.255.255.252
 ip nat outside
 ip virtual-reassembly in
 duplex auto
!
interface Ethernet0/1
 description https://ccielabcenter.com
 ip address 10.1.99.2 255.255.255.252
 ip nat inside
 ip virtual-reassembly in
 ip ospf 1 area 0
 duplex auto
 ipv6 address FE80::12 link-local
!
interface Ethernet0/2
 description https://ccielabcenter.com
 ip address 10.1.12.1 255.255.255.252
 ip nat inside
 ip virtual-reassembly in
 ip ospf 1 area 0
 duplex auto
 ipv6 address FE80::12 link-local
!
interface Ethernet0/3
 description https://ccielabcenter.com
 ip address 10.1.11.1 255.255.255.252
 ip nat inside
 ip virtual-reassembly in
 ip ospf 1 area 0
 duplex auto
 ipv6 address FE80::12 link-local
!
!
router eigrp ccie
 !
 address-family ipv6 unicast autonomous-system 65001
  !
  af-interface default
   shutdown
   passive-interface
  exit-af-interface
  !
  af-interface Ethernet0/1
   no shutdown
   no passive-interface
  exit-af-interface
  !
  af-interface Ethernet0/2
   no shutdown
   no passive-interface
  exit-af-interface
  !
  af-interface Ethernet0/3
   no shutdown
   no passive-interface
  exit-af-interface
  !
  af-interface Loopback0
   no shutdown
  exit-af-interface
  !
  topology base
  exit-af-topology
 exit-address-family
!
router ospf 1
 default-information originate metric 50000
!
router bgp 65001
 bgp log-neighbor-changes
 neighbor 200.99.12.1 remote-as 19999
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
ip nat inside source list NAT interface Ethernet0/0 overload
!
ip access-list standard NAT
 permit 10.0.0.0 0.255.255.255
!
ipv6 ioam timestamp
!
!
!
control-plane
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
line vty 0 4
 privilege level 15
 no login
 transport input all
!
!
end
