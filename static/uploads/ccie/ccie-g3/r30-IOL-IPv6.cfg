version 15.7
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname r30-IOL-IPv6
!
boot-start-marker
boot-end-marker
!
!
!
no aaa new-model
!
!
!
mmi polling-interval 60
no mmi auto-configure
no mmi pvc
mmi snmp-timeout 180
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!


!
!
!
!
no ip domain lookup
ip cef
ipv6 unicast-routing
ipv6 cef
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
redundancy
!
!
! 
!
!
!
!
!
!
!
!
!
!
!
!
interface Loopback100
 description Simulated-IaaS-Service
 ip address 10.3.100.10 255.255.255.255
!
interface Ethernet0/0
 ip address 100.4.30.2 255.255.255.252
 duplex auto
 ipv6 address 2001:DB8:14::1/64
!
interface Ethernet0/1
 no ip address
 shutdown
 duplex auto
!
interface Ethernet0/2
 no ip address
 shutdown
 duplex auto
!
interface Ethernet0/3
 no ip address
 shutdown
 duplex auto
!
router bgp 65003
 bgp router-id 10.3.255.30
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor 2001:DB8:14::2 remote-as 10000
 neighbor 100.4.30.1 remote-as 10000
 !
 address-family ipv4
  network 10.3.100.10 mask 255.255.255.255
  neighbor 100.4.30.1 activate
 exit-address-family
 !
 address-family ipv6
  network 2001:DB8:14::/64
  neighbor 2001:DB8:14::2 activate
 exit-address-family
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
!
ipv6 ioam timestamp
!
!
!
control-plane
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 logging synchronous
line aux 0
line vty 0 4
 login
 transport input none
!
!
end
