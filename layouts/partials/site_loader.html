<div id="site-loader" role="status" aria-label="页面加载中" hidden>
    <div class="site-loader__content" aria-hidden="true">
        <span class="site-loader__mark">xvsf</span>
        <span class="site-loader__ring"></span>
    </div>
</div>
<script>
    (() => {
        const root = document.documentElement;
        const loader = document.getElementById('site-loader');
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const requestedAt = window.__siteLoaderRequestedAt || performance.now();
        const minimumVisibleMs = 300;
        const fallbackMs = 4000;
        const fadeMs = reduceMotion ? 0 : 280;
        let leaveTimer;
        let finishTimer;
        let fallbackTimer;
        let finished = false;
        let completed = false;
        const inerted = [];

        const protectContent = (node) => {
            if (!(node instanceof HTMLElement) || node === loader || node.hasAttribute('inert')) return;
            node.inert = true;
            inerted.push(node);
        };

        Array.from(document.body.children).forEach(protectContent);
        const contentObserver = new MutationObserver((records) => {
            records.forEach((record) => record.addedNodes.forEach(protectContent));
        });
        contentObserver.observe(document.body, { childList: true });

        loader.hidden = false;
        const shownAt = performance.now();

        const finish = () => {
            if (completed) return;
            completed = true;
            clearTimeout(leaveTimer);
            clearTimeout(finishTimer);
            clearTimeout(fallbackTimer);
            loader.hidden = true;
            loader.classList.remove('is-leaving');
            root.classList.remove('site-loader-active');
            root.classList.remove('site-loader-revealing');
            window.__siteLoaderFinished = true;
            window.dispatchEvent(new Event('site-loader:finished'));
        };

        const revealContent = () => {
            contentObserver.disconnect();
            inerted.forEach((node) => { node.inert = false; });
            inerted.length = 0;
            root.classList.add('site-loader-revealing');
        };

        const leave = (immediate = false) => {
            if (immediate && finished) {
                finish();
                return;
            }
            if (finished) return;

            if (immediate) clearTimeout(leaveTimer);

            const elapsed = performance.now() - shownAt;
            const delay = immediate ? 0 : Math.max(0, minimumVisibleMs - elapsed);

            if (delay > 0) {
                if (!leaveTimer) leaveTimer = setTimeout(() => leave(), delay);
                return;
            }

            finished = true;
            revealContent();
            loader.classList.add('is-leaving');
            if (fadeMs) finishTimer = setTimeout(finish, fadeMs);
            else finish();
        };

        if (document.readyState === 'complete') {
            leave();
        } else {
            window.addEventListener('load', () => leave(), { once: true });
        }

        window.addEventListener('pageshow', (event) => {
            if (event.persisted) leave(true);
        });

        fallbackTimer = setTimeout(() => leave(true), Math.max(0, fallbackMs - (performance.now() - requestedAt)));
    })();
</script>
