{{- /* Official assets: Yuque homepage favicon and WeChat Design brand-resource app icon. */ -}}
{{- if eq . "yuque" -}}
<img src="{{ "img/yuque-icon.png" | relURL }}" alt="" width="200" height="200" loading="lazy" decoding="async">
{{- else if eq . "wechat" -}}
<img src="{{ "img/wechat-icon.png" | relURL }}" alt="" width="600" height="600" loading="lazy" decoding="async">
{{- else -}}
{{- partial "svg.html" (dict "name" .) -}}
{{- end -}}
