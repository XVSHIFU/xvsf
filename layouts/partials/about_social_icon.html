{{- /* Glyphs from the same Fluid/Alibaba Iconfont set used by the first blog. */ -}}
{{- if eq . "github" -}}
<span class="about-iconfont">&#xe768;</span>
{{- else if eq . "yuque" -}}
<span class="about-iconfont">&#xe7ac;</span>
{{- else if eq . "wechat" -}}
<span class="about-iconfont">&#xe78f;</span>
{{- else if eq . "rss" -}}
<span class="about-iconfont">&#xf09d;</span>
{{- else -}}
{{- partial "svg.html" (dict "name" .) -}}
{{- end -}}
