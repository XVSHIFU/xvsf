<!-- ========================================== -->
<!-- 1. 代码块折叠与复制功能 -->
{{- if .IsPage }}
<script>
document.addEventListener('DOMContentLoaded', function() {
    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    var runningAnimations = new WeakMap();
    var copyTimers = new WeakMap();

    function updateDisclosureState(container, expanded) {
        var content = container.querySelector('.code-content');
        var toggle = container.querySelector('.toggle-btn');
        if (!content || !toggle) return;

        container.setAttribute('data-expanded', String(expanded));
        container.setAttribute('aria-expanded', String(expanded));
        toggle.setAttribute('aria-expanded', String(expanded));
        toggle.setAttribute('aria-label', expanded ? '收起代码块' : '展开代码块');
        toggle.setAttribute('title', expanded ? '收起代码块' : '展开代码块');
        content.setAttribute('aria-hidden', String(!expanded));

        if (expanded) {
            content.removeAttribute('inert');
        } else {
            content.setAttribute('inert', '');
        }
    }

    function setExpanded(container, expanded) {
        var content = container.querySelector('.code-content');
        if (!content) return;

        // Capture the rendered state first so a quick second click reverses smoothly.
        var startHeight = content.hidden ? 0 : content.getBoundingClientRect().height;
        var startOpacity = content.hidden ? 0 : parseFloat(window.getComputedStyle(content).opacity);
        var previousAnimation = runningAnimations.get(content);
        if (previousAnimation) previousAnimation.cancel();

        content.hidden = false;
        updateDisclosureState(container, expanded);

        if (reduceMotion.matches || typeof content.animate !== 'function') {
            content.classList.remove('is-disclosure-animating');
            if (!expanded) content.hidden = true;
            return;
        }

        content.classList.add('is-disclosure-animating');
        var endHeight = expanded ? content.scrollHeight : 0;
        var endOpacity = expanded ? 1 : 0;
        var animation = content.animate([
            { maxHeight: startHeight + 'px', opacity: Number.isFinite(startOpacity) ? startOpacity : (expanded ? 0 : 1) },
            { maxHeight: endHeight + 'px', opacity: endOpacity }
        ], {
            duration: 300,
            easing: 'ease-out'
        });
        runningAnimations.set(content, animation);

        animation.addEventListener('finish', function() {
            if (runningAnimations.get(content) !== animation) return;
            runningAnimations.delete(content);
            content.classList.remove('is-disclosure-animating');
            if (!expanded && container.getAttribute('data-expanded') === 'false') {
                content.hidden = true;
            }
        }, { once: true });
        animation.addEventListener('cancel', function() {
            if (runningAnimations.get(content) !== animation) return;
            runningAnimations.delete(content);
            content.classList.remove('is-disclosure-animating');
        }, { once: true });
    }

    function legacyCopy(text) {
        var textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.setAttribute('readonly', '');
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        var copied = document.execCommand('copy');
        textarea.remove();
        if (!copied) throw new Error('Copy command was rejected');
    }

    async function copyCode(button) {
        var container = button.closest('.code-block-container');
        var codeElement = container && (container.querySelector('.lntd:last-child code') || container.querySelector('code'));
        if (!codeElement) return;
        // textContent remains available while the default-collapsed block is hidden.
        var code = codeElement.textContent || '';

        try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                try {
                    await navigator.clipboard.writeText(code);
                } catch (clipboardError) {
                    legacyCopy(code);
                }
            } else {
                legacyCopy(code);
            }

            var originalLabel = button.dataset.copyLabel || button.getAttribute('aria-label') || '复制代码';
            var originalTitle = button.dataset.copyTitle || button.getAttribute('title') || originalLabel;
            button.dataset.copyLabel = originalLabel;
            button.dataset.copyTitle = originalTitle;
            var previousTimer = copyTimers.get(button);
            if (previousTimer) window.clearTimeout(previousTimer);
            button.setAttribute('aria-label', '已复制');
            button.setAttribute('title', '已复制');
            button.style.color = 'var(--link-color)';
            copyTimers.set(button, window.setTimeout(function() {
                button.setAttribute('aria-label', originalLabel);
                button.setAttribute('title', originalTitle);
                button.style.color = '';
                copyTimers.delete(button);
            }, 1400));
        } catch (error) {
            console.error('Failed to copy!', error);
        }
    }

    // One delegated listener replaces three listeners on every code block.
    document.addEventListener('click', function(event) {
        var target = event.target instanceof Element ? event.target : event.target.parentElement;
        if (!target) return;
        var header = target.closest('.code-header');
        if (!header) return;
        var container = header.closest('.code-block-container');
        if (!container) return;

        var copyButton = target.closest('.copy-btn');
        if (copyButton) {
            copyCode(copyButton);
            return;
        }

        var expanded = container.getAttribute('data-expanded') === 'true';
        setExpanded(container, !expanded);
    });
});
</script>
{{- end }}

<!-- ========================================== -->
<!-- 2. 本地化樱花特效 (无外部依赖，肯定能用) -->
<!-- ========================================== -->
<script>
(function() {
    var reduceMotionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    var desktopPointerQuery = window.matchMedia('(min-width: 769px) and (hover: hover) and (pointer: fine)');
    var started = false;

    function startSakura() {
        if (reduceMotionQuery.matches || !desktopPointerQuery.matches || !Element.prototype.animate) return;
        if (started) return;
        started = true;

        var leafCount = 24 + Math.floor(Math.random() * 7);
        var animations = [];
        var emittedLeaves = 0;
        var activeLeaves = 0;
        var emissionFinished = false;
        var cleaned = false;
        var spawnTimer;
        var cleanupTimer;

        var container = document.createElement('div');
        container.id = 'sakura-container';
        container.style.cssText = 'position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:9999;';
        document.body.appendChild(container);

        function cleanupSakura() {
            if (cleaned) return;
            cleaned = true;
            window.clearTimeout(spawnTimer);
            window.clearTimeout(cleanupTimer);
            animations.forEach(function(animation) { animation.cancel(); });
            container.remove();
            reduceMotionQuery.removeEventListener('change', handleMotionPreference);
            window.removeEventListener('pagehide', cleanupSakura);
        }

        function handleMotionPreference(event) {
            if (event.matches) cleanupSakura();
        }

        function createLeaf() {
            if (cleaned || !container.isConnected) return;

            var leaf = document.createElement('div');
            var leafWidth = Math.random() * 10 + 10;
            var leafHeight = Math.random() * 5 + 5;
            var peakOpacity = Math.random() * 0.5 + 0.3;
            leaf.style.width = leafWidth + 'px';
            leaf.style.height = leafHeight + 'px';
            leaf.style.background = 'linear-gradient(to bottom right, #ffc0cb, #ffb6c1)';
            leaf.style.cssText += 'position:absolute;top:0;left:' + (Math.random() * 100) + '%;border-radius:10px 0;opacity:0;will-change:transform,opacity;';
            container.appendChild(leaf);
            activeLeaves += 1;

            var duration = 6000 + Math.random() * 4000;
            var drift = Math.random() * 220 - 110;
            var sway = Math.random() * 50 + 25;
            var rotationDirection = Math.random() < 0.5 ? -1 : 1;
            var rotation = rotationDirection * (260 + Math.random() * 460);
            var landingShift = Math.random() * 12 - 6;
            var landY = 'calc(100vh - ' + (leafHeight + 5).toFixed(1) + 'px)';
            var bounceY = 'calc(100vh - ' + (leafHeight + 18).toFixed(1) + 'px)';
            var landed = 'translate3d(' + drift.toFixed(1) + 'px,' + landY + ',0) rotate(' + rotation.toFixed(1) + 'deg)';

            var animation = leaf.animate([
                { transform: 'translate3d(0,-24px,0) rotate(0deg)', opacity: 0 },
                {
                    transform: 'translate3d(' + (sway * 0.45).toFixed(1) + 'px,8vh,0) rotate(' + (rotation * 0.08).toFixed(1) + 'deg)',
                    opacity: peakOpacity,
                    offset: 0.08
                },
                {
                    transform: 'translate3d(' + (drift * 0.25 + sway).toFixed(1) + 'px,34vh,0) rotate(' + (rotation * 0.28).toFixed(1) + 'deg)',
                    opacity: peakOpacity,
                    offset: 0.32
                },
                {
                    transform: 'translate3d(' + (drift * 0.62 - sway * 0.75).toFixed(1) + 'px,60vh,0) rotate(' + (rotation * 0.58).toFixed(1) + 'deg)',
                    opacity: peakOpacity,
                    offset: 0.56
                },
                {
                    transform: landed,
                    opacity: peakOpacity * 0.9,
                    offset: 0.74,
                    easing: 'cubic-bezier(0.2, 0.8, 0.3, 1)'
                },
                {
                    transform: 'translate3d(' + (drift + landingShift).toFixed(1) + 'px,' + bounceY + ',0) rotate(' + (rotation + rotationDirection * 16).toFixed(1) + 'deg) scaleY(0.9)',
                    opacity: peakOpacity * 0.86,
                    offset: 0.8,
                    easing: 'cubic-bezier(0.24, 0.68, 0.35, 1)'
                },
                {
                    transform: landed + ' scaleY(0.95)',
                    opacity: peakOpacity * 0.82,
                    offset: 0.85
                },
                {
                    transform: landed + ' scaleY(0.95)',
                    opacity: peakOpacity * 0.78,
                    offset: 0.88
                },
                {
                    transform: landed + ' scale(0.82)',
                    opacity: 0,
                    offset: 1
                }
            ], {
                duration: duration,
                easing: 'linear',
                fill: 'both'
            });
            animations.push(animation);
            animation.finished.then(function() {
                leaf.remove();
                activeLeaves -= 1;
                if (emissionFinished && activeLeaves === 0) cleanupSakura();
            }).catch(function() {});
        }

        function emitNextLeaf() {
            if (cleaned) return;

            createLeaf();
            emittedLeaves += 1;

            if (emittedLeaves < leafCount) {
                spawnTimer = window.setTimeout(emitNextLeaf, 450 + Math.random() * 200);
            } else {
                emissionFinished = true;
            }
        }

        emitNextLeaf();
        cleanupTimer = window.setTimeout(cleanupSakura, 32000);
        reduceMotionQuery.addEventListener('change', handleMotionPreference);
        window.addEventListener('pagehide', cleanupSakura, { once: true });
    }

    function scheduleSakura() {
        if ('requestIdleCallback' in window) {
            window.requestIdleCallback(startSakura, { timeout: 1200 });
        } else {
            window.requestAnimationFrame(startSakura);
        }
    }

    if (document.readyState === 'complete') scheduleSakura();
    else window.addEventListener('load', scheduleSakura, { once: true });
})();
</script>

<!-- ========================================== -->
<!-- 3. 深色/浅色切换：四种加权随机动画 -->
<!-- ========================================== -->
<script>
(function() {
    // 辅助：生成 polygon 起点（所有顶点收束到按钮位置）
    function pt(n, x, y, w, h) {
        var c = (x/w*100).toFixed(1) + '% ' + (y/h*100).toFixed(1) + '%';
        return 'polygon(' + Array(n).fill(c).join(', ') + ')';
    }

    // 丝滑缓动曲线
    var silk  = 'cubic-bezier(0.22, 1, 0.36, 1)';   // ease-out-quint：最丝滑
    var snap  = 'cubic-bezier(0.33, 1, 0.68, 1)';   // ease-out-cubic：干脆

    var effects = [
        // ① 经典圆形扩散
        function(x, y, r) {
            return { kf: { clipPath: [
                'circle(0px at '+x+'px '+y+'px)',
                'circle('+r+'px at '+x+'px '+y+'px)'
            ]}, dur: 380, ease: silk };
        },

        // ② 对角线擦除 —— 从按钮所在角落斜切全屏
        function(x, y, r, w, h) {
            var l = x < w/2, t = y < h/2;
            var sx = l ? '-5%' : '105%', sy = t ? '-5%' : '105%';
            var ex = l ? '200%' : '-100%', ey = t ? '200%' : '-100%';
            return { kf: { clipPath: [
                'polygon('+sx+' '+sy+', '+sx+' '+sy+', '+sx+' '+sy+', '+sx+' '+sy+')',
                'polygon('+sx+' '+sy+', '+ex+' '+sy+', '+ex+' '+ey+', '+sx+' '+ey+')'
            ]}, dur: 400, ease: snap };
        },

        // ③ 水滴流体 —— 有机的不规则扩散
        function(x, y, r, w, h) {
            return { kf: { clipPath: [
                pt(8, x, y, w, h),
                'polygon(-12% 28%, 22% -18%, 62% -8%, 118% 22%, 122% 72%, 78% 118%, 22% 112%, -18% 68%)'
            ]}, dur: 460, ease: silk };
        },

        // ④ 蜂巢六边形 —— 科技感
        function(x, y, r, w, h) {
            return { kf: { clipPath: [
                pt(6, x, y, w, h),
                'polygon(50% -45%, 135% 2%, 135% 98%, 50% 145%, -35% 98%, -35% 2%)'
            ]}, dur: 420, ease: silk };
        }
    ];

    var effectWeights = [50, 20, 15, 15];
    var lastIdx = -1;
    var transitionRunning = false;

    function pickEffect() {
        var total = effectWeights.reduce(function(sum, weight) { return sum + weight; }, 0);
        var value = Math.random() * total;
        for (var index = 0; index < effectWeights.length; index++) {
            value -= effectWeights[index];
            if (value <= 0) return index;
        }
        return 0;
    }
    var themeToggle = document.getElementById('theme-toggle');
    if (!themeToggle) return;

    themeToggle.addEventListener('click', function(e) {
        e.stopPropagation();
        if (transitionRunning) return;

        var btn = e.currentTarget;
        var html = document.documentElement;
        var isDark = html.dataset.theme === 'dark';
        var newTheme = isDark ? 'light' : 'dark';

        var rect = btn.getBoundingClientRect();
        var x = rect.left + rect.width / 2;
        var y = rect.top  + rect.height / 2;
        var w = window.innerWidth, h = window.innerHeight;
        var R = Math.hypot(Math.max(x, w - x), Math.max(y, h - y));

        if (!document.startViewTransition ||
            window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            html.dataset.theme = newTheme;
            localStorage.setItem('pref-theme', newTheme);
            return;
        }

        transitionRunning = true;
        var transition;
        try {
            transition = document.startViewTransition(function() {
                html.dataset.theme = newTheme;
                localStorage.setItem('pref-theme', newTheme);
            });
        } catch (_) {
            transitionRunning = false;
            html.dataset.theme = newTheme;
            localStorage.setItem('pref-theme', newTheme);
            return;
        }

        transition.ready.then(function() {
            var isNowDark = (newTheme === 'dark');

            // 圆形占一半，其余偶尔出现；连续两次不重复。
            var idx;
            do { idx = pickEffect(); }
            while (idx === lastIdx && effects.length > 1);
            lastIdx = idx;

            var fx = effects[idx](x, y, R, w, h);

            // 构建 keyframes：暗色模式反转方向
            var keyframes = {};
            Object.keys(fx.kf).forEach(function(prop) {
                keyframes[prop] = isNowDark ? fx.kf[prop].slice().reverse() : fx.kf[prop];
            });

            document.documentElement.animate(keyframes, {
                duration: fx.dur,
                easing:   fx.ease,
                fill:     'forwards',
                pseudoElement: isNowDark
                    ? '::view-transition-old(root)'
                    : '::view-transition-new(root)'
            });
        }).catch(function() {});

        transition.finished.then(function() {
            transitionRunning = false;
        }, function() {
            transitionRunning = false;
        });
    });
})();
</script>

<!-- ========================================== -->
<!-- 4. Lightbox 图片灯箱 -->
<!-- ========================================== -->
{{- if .IsPage }}
<script>
(function() {
    var overlay = document.getElementById('lightbox-overlay');
    if (!overlay) return;
    var lbImg = overlay.querySelector('.lightbox-img');
    var prevBtn = overlay.querySelector('.lightbox-prev');
    var nextBtn = overlay.querySelector('.lightbox-next');
    var postContent = document.querySelector('.post-content');
    if (!postContent) return;
    var images = Array.from(postContent.querySelectorAll('img'));
    var currentIndex = 0;
    var previouslyFocused = null;

    function getImageControl(img) {
        return img.closest('a, button') || img;
    }

    function prepareImages() {
        images = Array.from(postContent.querySelectorAll('img'));
        images.forEach(function(img) {
            var parentControl = img.closest('a, button');
            var control = parentControl || img;
            control.setAttribute('aria-haspopup', 'dialog');
            control.setAttribute('aria-controls', 'lightbox-overlay');

            if (!parentControl) {
                img.tabIndex = 0;
                img.setAttribute('role', 'button');
                img.setAttribute('aria-label', img.alt ? '查看大图：' + img.alt : '查看大图');
            }
        });
    }

    function showImage(index) {
        if (!images.length) return;
        currentIndex = (index + images.length) % images.length;
        var img = images[currentIndex];
        lbImg.src = img.currentSrc || img.src;
        lbImg.alt = img.alt || '';
        overlay.setAttribute('aria-label', img.alt ? '图片预览：' + img.alt : '图片预览');
    }

    function openImage(img, event) {
        prepareImages();
        var index = images.indexOf(img);
        if (index < 0) return;

        if (event) event.preventDefault();
        previouslyFocused = getImageControl(img);
        showImage(index);
        overlay.hidden = false;
        overlay.inert = false;
        overlay.classList.add('active');
        overlay.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
        overlay.querySelector('.lightbox-close').focus();
    }

    function findImage(target) {
        if (!(target instanceof Element)) return null;
        if (target.matches('img')) return target;
        if (target.matches('a, button')) return target.querySelector('img');
        return null;
    }

    // Delegate image opening so long articles keep one listener instead of one per image.
    postContent.addEventListener('click', function(event) {
        var img = findImage(event.target);
        if (!img || !postContent.contains(img)) return;
        openImage(img, event);
    });

    postContent.addEventListener('keydown', function(event) {
        if (event.key !== 'Enter' && event.key !== ' ') return;
        var img = event.target instanceof Element && event.target.matches('img[role="button"]')
            ? event.target
            : null;
        if (!img) return;
        openImage(img, event);
    });

    function closeLightbox() {
        overlay.classList.remove('active');
        overlay.setAttribute('aria-hidden', 'true');
        overlay.inert = true;
        overlay.hidden = true;
        document.body.style.overflow = '';
        if (previouslyFocused && typeof previouslyFocused.focus === 'function') {
            previouslyFocused.focus();
        }
    }

    function isOpen() {
        return overlay.classList.contains('active');
    }

    function trapFocus(event) {
        var focusable = Array.from(overlay.querySelectorAll(
            'button:not([disabled]), [href], [tabindex]:not([tabindex="-1"])'
        ));
        if (!focusable.length) return;

        var first = focusable[0];
        var last = focusable[focusable.length - 1];
        if (event.shiftKey && (document.activeElement === first || !overlay.contains(document.activeElement))) {
            event.preventDefault();
            last.focus();
        } else if (!event.shiftKey && (document.activeElement === last || !overlay.contains(document.activeElement))) {
            event.preventDefault();
            first.focus();
        }
    }

    overlay.addEventListener('click', function(e) {
        if (e.target !== lbImg && !e.target.closest('.lightbox-nav')) closeLightbox();
    });
    overlay.querySelector('.lightbox-close').addEventListener('click', closeLightbox);
    prevBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        showImage(currentIndex - 1);
    });
    nextBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        showImage(currentIndex + 1);
    });
    document.addEventListener('keydown', function(e) {
        if (!isOpen()) return;
        if (e.key === 'Tab') trapFocus(e);
        if (e.key === 'Escape') {
            e.preventDefault();
            closeLightbox();
        }
        if (e.key === 'ArrowLeft') {
            e.preventDefault();
            showImage(currentIndex - 1);
        }
        if (e.key === 'ArrowRight') {
            e.preventDefault();
            showImage(currentIndex + 1);
        }
    });

    prepareImages();
})();
</script>
{{- end }}

<!-- 5. Giscus 评论主题跟随切换 -->
<!-- ========================================== -->
{{- if and .IsPage (.Param "comments") }}
<script>
(function() {
    var observer = new MutationObserver(function(mutations) {
        mutations.forEach(function(m) {
            if (m.attributeName === 'data-theme') {
                var theme = document.documentElement.getAttribute('data-theme') === 'dark'
                    ? 'dark_protanopia' : 'light_protanopia';
                var iframe = document.querySelector('iframe.giscus-frame');
                if (iframe) {
                    iframe.contentWindow.postMessage(
                        { giscus: { setConfig: { theme: theme } } },
                        'https://giscus.app'
                    );
                }
            }
        });
    });
    observer.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
})();
</script>
{{- end }}

<!-- 6. 首页打字机效果 -->
<!-- ========================================== -->
{{- if .IsHome }}
<script>
(function() {
    var container = document.getElementById('typewriter-content');
    if (!container) return;
    var target = container.querySelector('p') || container;
    var text = target.textContent.trim();
    if (!text) return;

    target.textContent = '';
    var cursor = document.createElement('span');
    cursor.className = 'typewriter-cursor';
    cursor.innerHTML = '\u00a0';
    target.appendChild(cursor);

    var i = 0;
    function type() {
        if (i < text.length) {
            target.insertBefore(document.createTextNode(text.charAt(i)), cursor);
            i++;
            setTimeout(type, 80);
        } else {
            setTimeout(function() { cursor.style.display = 'none'; }, 3000);
        }
    }
    type();
})();
</script>
{{- end }}

<!-- 8. Konami Code 彩蛋 ↑↑↓↓←→←→BA -->
<!-- ========================================== -->
<script>
(function() {
    var seq = [38,38,40,40,37,39,37,39,66,65];
    var pos = 0;
    document.addEventListener('keydown', function(e) {
        if (e.keyCode === seq[pos]) {
            pos++;
            if (pos === seq.length) {
                pos = 0;
                showEgg();
            }
        } else {
            pos = 0;
        }
    });

    function typeIt(el, text, speed, cb) {
        var i = 0;
        (function t() {
            if (i < text.length) {
                if (text.charAt(i) === '\n') {
                    el.appendChild(document.createElement('br'));
                } else {
                    el.appendChild(document.createTextNode(text.charAt(i)));
                }
                i++;
                setTimeout(t, speed);
            } else if (cb) cb();
        })();
    }

    function showEgg() {
        var o = document.createElement('div');
        o.style.cssText = 'position:fixed;inset:0;background:#0a0a0a;z-index:99999;display:flex;align-items:center;justify-content:center;flex-direction:column;font-family:"Courier New",Consolas,monospace;cursor:pointer;opacity:0;transition:opacity .5s;overflow:hidden';
        o.innerHTML = '<div style="position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,255,0,.03) 2px,rgba(0,255,0,.03) 4px);pointer-events:none"></div>'
            + '<pre id="egg-art" style="color:#0f0;font-size:18px;line-height:1.3;text-align:center;position:relative;text-shadow:0 0 6px rgba(0,255,0,.5)"></pre>'
            + '<p id="egg-msg" style="color:#0f0;font-size:15px;margin-top:20px;position:relative;text-shadow:0 0 6px rgba(0,255,0,.5);opacity:.85"></p>'
            + '<p style="color:#333;font-size:12px;margin-top:32px;position:relative">[ click anywhere to close ]</p>';
        document.body.appendChild(o);

        typeIt(document.getElementById('egg-art'), art, 22, function() {
            typeIt(document.getElementById('egg-msg'), msg, 35);
        });

        function close() {

        setTimeout(function() { if (o.parentNode) close(); }, 10000);
    }
})();

<!-- ========================================== -->
<!-- 12. 文章卡片鼠标跟随倾斜（兼容内嵌浏览器） -->
<!-- ========================================== -->
{{- if not .IsPage }}
<script>
(function() {
    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduceMotion) return;

    var maxDegrees = 3.2;
    var activeCard = null;
    var activeRect = null;
    var pointerX = 0;
    var pointerY = 0;
    var frame = 0;
    var ignoreMouseUntil = 0;

    function resetCard() {
        if (frame) cancelAnimationFrame(frame);
        frame = 0;
        if (activeCard) {
            activeCard.classList.remove('is-tilting');
            activeCard.style.removeProperty('--tilt-x');
            activeCard.style.removeProperty('--tilt-y');
        }
        activeCard = null;
        activeRect = null;
    }

    function renderTilt() {
        frame = 0;
        if (!activeCard || !activeRect) return;

        var x = Math.max(-0.5, Math.min(0.5, (pointerX - activeRect.left) / activeRect.width - 0.5));
        var y = Math.max(-0.5, Math.min(0.5, (pointerY - activeRect.top) / activeRect.height - 0.5));
        activeCard.style.setProperty('--tilt-x', (-y * maxDegrees * 2).toFixed(2) + 'deg');
        activeCard.style.setProperty('--tilt-y', (x * maxDegrees * 2).toFixed(2) + 'deg');
        activeCard.classList.add('is-tilting');
    }

    document.addEventListener('mouseover', function(event) {
        if (Date.now() < ignoreMouseUntil) return;
        if (!(event.target instanceof Element)) return;
        var card = event.target.closest('.post-entry');
        if (!card || card === activeCard) return;
        resetCard();
        document.documentElement.classList.add('has-mouse-input');
        activeCard = card;
        activeRect = card.getBoundingClientRect();
        pointerX = event.clientX;
        pointerY = event.clientY;
        frame = requestAnimationFrame(renderTilt);
    }, { passive: true });

    document.addEventListener('mousemove', function(event) {
        if (!activeCard || Date.now() < ignoreMouseUntil) return;
        pointerX = event.clientX;
        pointerY = event.clientY;
        if (!frame) frame = requestAnimationFrame(renderTilt);
    }, { passive: true });

    document.addEventListener('mouseout', function(event) {
        if (!activeCard) return;
        if (!(event.target instanceof Element)) return;
        var card = event.target.closest('.post-entry');
        var nextTarget = event.relatedTarget;
        if (card !== activeCard || (nextTarget instanceof Node && card.contains(nextTarget))) return;
        resetCard();
    }, { passive: true });

    document.addEventListener('touchstart', function() {
        ignoreMouseUntil = Date.now() + 1200;
        resetCard();
    }, { passive: true });
    window.addEventListener('blur', resetCard);
})();
</script>
{{- end }}

<!-- 13. 建站天数计时器 -->
<!-- ========================================== -->
<script>
(function() {
    var el = document.getElementById('site-uptime');
    if (!el) return;
    var start = new Date({{ printf "%sT00:00:00+08:00" (site.Params.footer.startDate | default "2026-01-15") | jsonify | safeJS }}).getTime();
    function update() {
        var diff = Date.now() - start;
        var d = Math.floor(diff / 86400000);
        var h = Math.floor((diff % 86400000) / 3600000);
        var m = Math.floor((diff % 3600000) / 60000);
        el.textContent = d + ' \u5929 ' + h + ' \u5c0f\u65f6 ' + m + ' \u5206\u949f';
    }
    update();
    setInterval(update, 60000);
})();
</script>

<!-- ========================================== -->
<!-- 16. 代码块行号点击 → 复制行链接 (GitHub 风格) -->
<!-- ========================================== -->
{{- if .IsPage }}
<script>
(function() {
    document.addEventListener('click', function(e) {
        var ln = e.target.closest('.lnt, .ln');
        if (!ln) return;
        var lnt = ln.closest('.lnt') || ln;
        var num = (lnt.textContent || '').trim();
        if (!num) return;
        var url = location.origin + location.pathname + '#L' + num;
        navigator.clipboard.writeText(url).catch(function() {});
        history.replaceState(null, '', '#L' + num);
        var table = lnt.closest('.lntable');
        if (table) {
            table.querySelectorAll('.highlight-line').forEach(function(el) {
                el.classList.remove('highlight-line');
            });
            lnt.classList.add('highlight-line');
            var row = lnt.closest('tr');
            if (row) {
                var codeLines = row.querySelectorAll('.lntd:last-child .line');
                codeLines.forEach(function(el) { el.classList.add('highlight-line'); });
            }
        }
    });
    window.addEventListener('hashchange', highlightFromHash);
    highlightFromHash();
    function highlightFromHash() {
        var m = location.hash.match(/^#L(\d+)$/);
        if (!m) return;
        var target = document.getElementById(m[1]);
        if (!target) return;
        setTimeout(function() {
            target.classList.add('highlight-line');
            var row = target.closest('tr');
            if (row) {
                row.querySelectorAll('.lntd:last-child .line').forEach(function(el) {
                    el.classList.add('highlight-line');
                });
            }
            target.scrollIntoView({ block: 'center' });
        }, 100);
    }
})();
</script>
{{- end }}
