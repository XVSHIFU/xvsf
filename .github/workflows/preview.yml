name: Build protected draft preview

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-draft-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-24.04
    environment:
      name: preview
      url: https://cms-preview.xvshifu-xvsf-preview.pages.dev/
    env:
      PREVIEW_BASE_URL: https://cms-preview.xvshifu-xvsf-preview.pages.dev/
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          cache: npm
      - run: npm ci
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@aa6d1f754da6d11b067cadcbbab844c131535da1 # v3.2.0
        with:
          hugo-version: "0.162.0"
          extended: true
      - name: Run blocking checks
        run: npm run quality:check
      - name: Build all preview content
        run: >-
          node scripts/build-site.mjs --minify --panicOnWarning --cleanDestinationDir
          --buildDrafts --buildFuture --buildExpired
          --baseURL "$PREVIEW_BASE_URL"
          --destination .preview-site
      - name: Build Pagefind search index
        run: npx --no-install pagefind --site .preview-site
      - name: Add preview indexing controls
        shell: bash
        run: |
          printf 'User-agent: *\nDisallow: /\n' > .preview-site/robots.txt
          printf '/*\n  X-Robots-Tag: noindex, nofollow\n' > .preview-site/_headers
      - name: Deploy Cloudflare Pages preview
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.113.0"
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy .preview-site --project-name=xvshifu-xvsf-preview --branch=cms-preview --commit-dirty=true
      - name: Publish preview links
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        shell: bash
        run: |
          {
            echo '## 受保护的草稿预览'
            echo
            echo "- 预览首页：[$PREVIEW_BASE_URL]($PREVIEW_BASE_URL)"
            echo "- 本次部署：[$DEPLOYMENT_URL]($DEPLOYMENT_URL)"
            echo
            echo '访问时需要通过 Cloudflare Access 邮箱验证码。'
          } >> "$GITHUB_STEP_SUMMARY"
